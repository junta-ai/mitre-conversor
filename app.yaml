runtime: python311

env_variables:
  # Configurações da aplicação
  API_HOST: "0.0.0.0"
  API_PORT: "8080"
  
  # Configurações do RAG
  EMBEDDING_MODEL: "all-MiniLM-L6-v2"
  SIMILARITY_THRESHOLD: "0.7"
  
  LLM_ENABLED: "true"

automatic_scaling:
  min_instances: 0
  max_instances: 10
  target_cpu_utilization: 0.6

resources:
  cpu: 2
  memory_gb: 4

handlers:
- url: /.*
  script: auto